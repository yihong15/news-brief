name: brief
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      slot: {description: "noon / evening / parliament / check", default: "noon"}
concurrency: brief
permissions: {contents: write, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Run
        env: {ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then if [ "$(date -u +%H)" -lt 6 ]; then SLOT=noon; else SLOT=evening; fi; fi
          python src/run.py "$SLOT"
      - name: Commit
        run: |
          git config user.name brief-bot; git config user.email bot@users.noreply.github.com
          git add -A data docs; git commit -m "brief $(date -u +%F-%H%M)" || exit 0; git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: pip install requests && [ -f data/notify.json ] && python src/notify.py || true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
